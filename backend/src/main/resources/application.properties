spring.application.name=price-analyzer
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./price-analyzer;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
app.demo.seed=true
server.error.include-message=never

app.auth.jwt-secret=${APP_JWT_SECRET:}
app.auth.jwt-issuer=${APP_JWT_ISSUER:https://price-analyzer.local}
app.auth.jwt-audience=${APP_JWT_AUDIENCE:price-analyzer-api}
app.auth.origin=${APP_AUTH_ORIGIN:http://localhost:5173}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
